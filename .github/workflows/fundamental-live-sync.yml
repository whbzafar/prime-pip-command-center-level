name: Fundamental Live Data Refresh

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate refresh configuration
        env:
          FUNDAMENTAL_SYNC_URL: ${{ secrets.FUNDAMENTAL_SYNC_URL }}
          FUNDAMENTAL_SYNC_TOKEN: ${{ secrets.FUNDAMENTAL_SYNC_TOKEN }}
        run: |
          test -n "$FUNDAMENTAL_SYNC_URL" || { echo "FUNDAMENTAL_SYNC_URL secret is required"; exit 1; }
          test -n "$FUNDAMENTAL_SYNC_TOKEN" || { echo "FUNDAMENTAL_SYNC_TOKEN secret is required"; exit 1; }
      - name: Request live fundamentals refresh
        env:
          FUNDAMENTAL_SYNC_URL: ${{ secrets.FUNDAMENTAL_SYNC_URL }}
          FUNDAMENTAL_SYNC_TOKEN: ${{ secrets.FUNDAMENTAL_SYNC_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 180 \
            -X POST "$FUNDAMENTAL_SYNC_URL" \
            -H "Authorization: Bearer $FUNDAMENTAL_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"currency":"ALL","action":"SYNC"}'
