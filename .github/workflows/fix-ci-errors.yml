name: Fix current TypeScript errors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('server/routes/newsCalendarRoutes.ts')
          s = p.read_text()
          s = s.replace("/<![CDATA[([\\s\\S]*?)]]>/g", "/<!\\[CDATA\\[([\\s\\S]*?)\\]\\]>/g")
          p.write_text(s)

          p = Path('src/services/googleDriveService.ts')
          s = p.read_text()
          s = s.replace("  'Trade Analysis',\n", "  'Trade Analysis',\n  'Trade Setups & Screenshots',\n", 1)
          p.write_text(s)

          p = Path('src/components/CommunityChat.tsx')
          s = p.read_text()
          s = s.replace("  'Trade Analysis',\n", "  'Trade Analysis',\n  'Trade Setups & Screenshots',\n", 1)
          p.write_text(s)
          PY

      - name: Commit and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routes/newsCalendarRoutes.ts src/services/googleDriveService.ts src/components/CommunityChat.tsx .github/workflows/fix-ci-errors.yml
          git rm -f .github/workflows/fix-ci-errors.yml
          git commit -m "Fix TypeScript errors in calendar and Drive attachment categories" || exit 0
          git push
