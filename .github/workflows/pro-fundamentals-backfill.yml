name: Pro Fundamentals Historical Backfill & Calibration (Manual Dispatch)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Backfill component to execute'
        required: true
        default: 'scoring'
        type: choice
        options:
          - 'scoring'
          - 'collectors'
          - 'calibration_report'
          - 'all'
      start_date:
        description: 'Start date for scoring backfill (YYYY-MM-DD)'
        required: false
        default: '2024-01-01'
        type: string
      source:
        description: 'Collector source (if target is collectors or all)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'fred'
          - 'cftc'

concurrency:
  group: pro-fundamentals-backfill
  cancel-in-progress: false

jobs:
  run-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: 1. Collector Backfill (if requested)
        if: ${{ github.event.inputs.target == 'collectors' || github.event.inputs.target == 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CFTC_APP_TOKEN: ${{ secrets.CFTC_APP_TOKEN }}
        run: npx tsx backend/jobs/runBackfill.ts --source ${{ github.event.inputs.source }}

      - name: 2. Quantitative Scoring Historical Backfill (Fridays from 2024-01-01)
        if: ${{ github.event.inputs.target == 'scoring' || github.event.inputs.target == 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx backend/jobs/runBackfillScoring.ts

      - name: 3. Generate Quantitative Calibration Report
        if: ${{ github.event.inputs.target == 'calibration_report' || github.event.inputs.target == 'scoring' || github.event.inputs.target == 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx backend/jobs/generateCalibrationReport.ts

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 [ProFundamentals] Historical Backfill Job Failed: ${new Date().toISOString()}`;
            const body = `Historical backfill job (${context.payload.inputs.target}) failed.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['pipeline-failure', 'backfill-job']
            });
