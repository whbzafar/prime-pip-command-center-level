name: calendar-data
# Collects the economic-release history from TradingView's public calendar and publishes one JSON file
# to the `calendar-data` branch, which the app reads at start-up. Runs every 2 hours.
on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: calendar-data, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - name: Collect
        run: npx -y tsx@4 scripts/collect-calendar.ts out/calendar.json
      - name: Publish snapshot branch
        run: |
          cd out
          git init -q -b calendar-data
          git config user.name "calendar-bot"; git config user.email "bot@users.noreply.github.com"
          git add calendar.json
          git commit -qm "calendar snapshot $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" calendar-data
