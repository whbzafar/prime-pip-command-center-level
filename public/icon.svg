<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E33"/>
      <stop offset="100%" stop-color="#070A11"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Outer Crosshair Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1E293B" stroke-width="4" stroke-dasharray="16 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Crosshair Reticles -->
  <line x1="256" y1="48" x2="256" y2="100" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="412" x2="256" y2="464" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <line x1="48" y1="256" x2="100" y2="256" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <line x1="412" y1="256" x2="464" y2="256" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Candlesticks forming 'P' / tactical bars -->
  <!-- Bullish Candle 1 -->
  <line x1="180" y1="160" x2="180" y2="360" stroke="#10B981" stroke-width="4"/>
  <rect x="166" y="200" width="28" height="110" rx="4" fill="#10B981"/>
  
  <!-- Bullish Candle 2 (Center) -->
  <line x1="256" y1="130" x2="256" y2="380" stroke="#F59E0B" stroke-width="6"/>
  <rect x="238" y="170" width="36" height="150" rx="6" fill="url(#gold)"/>
  
  <!-- Candle 3 -->
  <line x1="332" y1="170" x2="332" y2="340" stroke="#10B981" stroke-width="4"/>
  <rect x="318" y="210" width="28" height="80" rx="4" fill="#10B981"/>

  <!-- Tactical Corner Brackets -->
  <path d="M 90 140 L 90 90 L 140 90" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 422 140 L 422 90 L 372 90" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 90 372 L 90 422 L 140 422" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
  <path d="M 422 372 L 422 422 L 372 422" fill="none" stroke="#F59E0B" stroke-width="5" stroke-linecap="round"/>
</svg>
