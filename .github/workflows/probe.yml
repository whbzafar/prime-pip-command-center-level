name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && cp tvmsg.mjs /tmp/pw/ && (cd /tmp/pw && timeout 300 node tvmsg.mjs) ; cp -r /tmp/pw/shots/. shots/ 2>/dev/null || true
      - run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout --orphan probe-shots-tmp; git rm -rqf --cached . ; git add shots; git commit -qm shots; git push -qf origin HEAD:probe-shots
