name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash {0}
        run: |
          B=https://prime-pip-command-center-level.vercel.app
          for i in $(seq 1 14); do
            n=0; for f in $(curl -s $B/ | grep -o 'assets/[^"]*\.js' | sort -u); do c=$(curl -s $B/$f | grep -c 'learning-hub'); n=$((n+c)); done
            echo "TRY $i new bundle: $n"; if [ "$n" -gt 0 ]; then break; fi; sleep 30
          done
          curl -s -o /dev/null -w 'APP %{http_code}\n' $B/
          curl -s -w ' TIME %{http_code}\n' $B/api/time
          curl -s -o /dev/null -w 'ADMIN hub without login %{http_code}\n' $B/api/admin/hub
          curl -s -w ' SBT %{http_code}\n' "$B/api/sbt/scan?symbol=EURUSD" | cut -c1-140
