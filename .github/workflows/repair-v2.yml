name: Apply PrimePipFx Integration Fixes V2
on:
  push:
    branches: [main]

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Drive, Friends, SBT PDF and risk advisory
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def R(p): return Path(p).read_text()
          def W(p,s): Path(p).write_text(s)

          # Google Drive: eliminate fake/simulated authentication and make connect resolve only after real OAuth.
          p='src/services/googleDriveService.ts'; s=R(p)
          s=s.replace("  private currentUserId: string = 'default';\n", "  private currentUserId: string = 'default';\n  private pendingConnectResolve: ((value: boolean) => void) | null = null;\n  private pendingConnectReject: ((reason?: any) => void) | null = null;\n")
          s=re.sub(r"callback: \(tokenResponse: any\) => \{.*?\n        \},", """callback: (tokenResponse: any) => {
            if (tokenResponse.error) {
              const message = tokenResponse.error_description || tokenResponse.error || 'Google authorization failed';
              this.notifyStatus({ state: 'ERROR', lastError: message });
              const reject = this.pendingConnectReject;
              this.pendingConnectResolve = null;
              this.pendingConnectReject = null;
              if (reject) reject(new Error(message));
              return;
            }
            if (tokenResponse.access_token) {
              const expiresIn = Number(tokenResponse.expires_in || 3599);
              const expiry = Date.now() + expiresIn * 1000;
              localStorage.setItem(this.getStorageKey(DRIVE_TOKEN_KEY), tokenResponse.access_token);
              localStorage.setItem(this.getStorageKey(DRIVE_EXPIRY_KEY), String(expiry));
              this.fetchUserInfo(tokenResponse.access_token);
              const resolve = this.pendingConnectResolve;
              this.pendingConnectResolve = null;
              this.pendingConnectReject = null;
              if (resolve) resolve(true);
            }
          },""", s, count=1, flags=re.S)
          s=re.sub(r"  public async connectGoogleDrive\(customClientId\?: string\): Promise<boolean> \{.*?\n  \}", """  public async connectGoogleDrive(customClientId?: string): Promise<boolean> {
    if (customClientId) this.setClientId(customClientId);
    if (this.getAccessToken()) return true;
    if (!this.tokenClient) this.setupTokenClient();
    if (!this.tokenClient && typeof window !== 'undefined') {
      await new Promise<void>((resolve) => {
        const started = Date.now();
        const timer = window.setInterval(() => {
          if (this.tokenClient || Date.now() - started >= 10000) {
            window.clearInterval(timer);
            resolve();
          }
        }, 100);
      });
    }
    if (!this.tokenClient) {
      const message = 'Google Drive authorization is not ready. Please allow Google Identity Services and try again.';
      this.notifyStatus({ state: 'ERROR', lastError: message });
      return false;
    }
    this.notifyStatus({ state: 'CONNECTING' });
    return new Promise<boolean>((resolve, reject) => {
      this.pendingConnectResolve = resolve;
      this.pendingConnectReject = reject;
      try {
        this.tokenClient.requestAccessToken({ prompt: 'select_account' });
      } catch (error: any) {
        this.pendingConnectResolve = null;
        this.pendingConnectReject = null;
        reject(error);
      }
    });
  }""", s, count=1, flags=re.S)
          s=re.sub(r"\n\s*// Fallback: If GSI script not yet loaded.*?return true;\n\s*\}", "\n", s, count=1, flags=re.S)
          W(p,s)

          # SBT PDF: both links use Google viewer and the first link no longer opens two tabs.
          p='src/components/sbt/SbtModelsHub.tsx'; s=R(p)
          if 'const officialSbtPdfPath' not in s:
            s=s.replace("  const [isFullscreenModelOpen, setIsFullscreenModelOpen] = useState(false);\n", "  const [isFullscreenModelOpen, setIsFullscreenModelOpen] = useState(false);\n  const officialSbtPdfPath = '/SBT/Official_Yearly_SBT_Models_Reference.pdf';\n  const officialSbtPdfUrl = typeof window !== 'undefined' ? `${window.location.origin}${officialSbtPdfPath}` : officialSbtPdfPath;\n  const googleSbtPdfUrl = `https://docs.google.com/gview?embedded=1&url=${encodeURIComponent(officialSbtPdfUrl)}`;\n")
          s=s.replace('href="/SBT/Official_Yearly_SBT_Models_Reference.pdf"','href={googleSbtPdfUrl}')
          s=re.sub(r"\n\s*onClick=\{\(e\) => \{\s*// Ensure clean opening in a new tab\s*const pdfUrl = `\$\{window\.location\.origin\}/SBT/Official_Yearly_SBT_Models_Reference\.pdf`;\s*window\.open\(pdfUrl, '_blank', 'noopener,noreferrer'\);\s*\}\}", '', s, count=1, flags=re.S)
          W(p,s)

          # Friends: Add Traders tab loads all admin-created CUSTOMER accounts automatically.
          p='src/components/communication/FriendSystem.tsx'; s=R(p)
          if 'const loadAllTraders = async () =>' not in s:
            marker="  const handleSearchUsers = async (e: React.FormEvent) => {"
            ins="""  const loadAllTraders = async () => {
    setIsSearching(true);
    const token = getStoredToken();
    try {
      const res = await fetch('/api/friends/search', { headers: { ...(token ? { Authorization: `Bearer ${token}` } : {}) } });
      if (res.ok) {
        const data = await res.json();
        setSearchResults(data.users || []);
      }
    } catch (err) {
      console.error('Trader list error:', err);
    } finally {
      setIsSearching(false);
    }
  };

"""
            s=s.replace(marker,ins+marker)
          s=s.replace("    if (!searchQuery.trim()) return;\n", "", 1)
          if "if (activeTab === 'FIND') loadAllTraders();" not in s:
            marker="  useEffect(() => {\n    fetchFriends();"
            s=s.replace(marker,"  useEffect(() => {\n    if (activeTab === 'FIND') loadAllTraders();\n  }, [activeTab, currentUser]);\n\n"+marker,1)
          W(p,s)

          # Remove the repair workflow after this commit so it cannot loop forever.
          Path('.github/workflows/repair-v2.yml').unlink()
          print('repairs prepared')
          PY
      - name: Verify TypeScript build
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .github/workflows/repair-v2.yml
          git commit -m "fix: stabilize Drive friends and SBT PDF integration"
          git push origin main
