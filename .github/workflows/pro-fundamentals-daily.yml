name: Pro Fundamentals Daily Pipeline

on:
  schedule:
    # 22:30 UTC Monday-Friday (6:30 PM US Eastern, safely after 5:00 PM US market close & Fed releases)
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pro-fundamentals-pipeline
  cancel-in-progress: false

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: 1. Run Data Collectors (FRED & CFTC)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          CFTC_APP_TOKEN: ${{ secrets.CFTC_APP_TOKEN }}
        run: npx tsx backend/jobs/runCollectors.ts --source fred

      - name: 2. Run Quantitative Scoring Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx backend/jobs/runScoring.ts

      - name: 3. Run Quality & Anomaly Checks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx backend/jobs/runQualityChecks.ts

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 [ProFundamentals] Daily Pipeline Failed: ${new Date().toISOString()}`;
            const body = `The daily incremental pipeline (collectors -> scoring -> quality checks) encountered an error.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nReview ingestion_runs in Supabase for stack trace.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['pipeline-failure', 'pro-fundamentals']
            });
