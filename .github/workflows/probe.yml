name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: write }
    env: { PRIMEPIPFX_SESSION_SECRET: ci-only-secret }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - if: ${{ false }}
        run: true
      - if: ${{ false }}
        run: true
      - if: ${{ false }}
        run: true
      - run: npm i -s playwright@1 && npx playwright install --with-deps chromium >/dev/null 2>&1 && mkdir -p shots && node prod2.mjs
      - if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -B probe-shots && git add -f shots && git commit -qm shots && git push -qf origin probe-shots
