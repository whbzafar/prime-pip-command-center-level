name: Build and publish to Render
# Render's free plan (512 MB) cannot run the front-end build, so GitHub builds the app for free
# and publishes the ready-to-run files to the `render-deploy` branch. Render redeploys from it.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: render-deploy
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Publish bundle
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          rm -rf /tmp/out && mkdir /tmp/out
          cp package.json package-lock.json /tmp/out/
          cp -r dist data /tmp/out/
          rm -f /tmp/out/data/pine_private_scripts.json /tmp/out/data/macro_fundamentals_store.json
          printf 'Prebuilt deploy output generated by GitHub Actions. Do not edit.\n' > /tmp/out/README.md
          printf 'node_modules/\n' > /tmp/out/.gitignore
          cd /tmp/out
          git init -q -b render-deploy
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Prebuilt bundle from main ${SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" render-deploy
