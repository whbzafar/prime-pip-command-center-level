name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: feature/fundamental-analysis-engine, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd app && npm ci --no-audit --no-fund >/dev/null 2>&1 && npm run build 2>&1 | tail -2
      - name: bundle checks
        run: |
          cd app
          echo "PHRASE 'This pair has arrived': $(grep -rl 'This pair has arrived' dist/assets/*.js | wc -l) bundle(s)"
          echo "FEMALE voice hints: $(grep -rl 'samantha' dist/assets/*.js | wc -l) bundle(s)"
          echo "FREE TIER removed from Subscription source: $(grep -c 'ACTIVATE FREE TIER' src/components/SubscriptionPage.tsx) (expect 0)"
      - run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          for i in 1 2 3; do npx playwright install --with-deps chromium && break; sleep 10; done
      - run: |
          (node fakekv.mjs > /tmp/kv.log 2>&1 &)
          (cd app && PORT=3000 PRIMEPIPFX_SESSION_SECRET=ci-only-secret-0123456789 PRIMEPIPFX_BOOTSTRAP_ADMIN_PASSWORD=ci-admin-pass-123456 PPFX_SHARED_KV_URL=http://localhost:8798/b node dist/server.cjs > /tmp/server.log 2>&1 &)
          sleep 15
          mkdir -p shots; cp t14.mjs /tmp/pw/ && (cd /tmp/pw && mkdir -p shots && timeout 900 node t14.mjs) || true; cp -r /tmp/pw/shots/. shots/ || true
      - if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -B probe-shots && git add -f shots && git commit -qm shots && git push -qf origin probe-shots
