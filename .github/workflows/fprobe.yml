name: fprobe
on: { push: { branches: [ci/fprobe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node fprobe.mjs || true
      - if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -B fprobe-out && git add -f shots && git commit -qm out && git push -qf origin fprobe-out
