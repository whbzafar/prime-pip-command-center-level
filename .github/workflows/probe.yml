name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          while read u; do [ -z "$u" ] && continue; echo "== $u"; curl -sS -m 15 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36' -o /tmp/o -w "%{http_code} %{size_download}\n" "$u"; head -c 200 /tmp/o | tr -s '\n\t ' ' '; echo; done < targets.txt
          sleep 240
          echo "==== FROM VERCEL"; curl -s -m 60 https://prime-pip-command-center-level.vercel.app/api/history/_sprobe | python3 -c "import json,sys; j=json.load(sys.stdin); [print(o.get('status', o.get('error')), o.get('bytes'), o['url'], '|', (o.get('head') or '')[:120]) for o in j['out']]"
          mkdir -p dump; for u in "https://www.myfxbook.com/community/outlook" "https://www.a1trading.com/retail-sentiment/" "https://fxssi.com/tools/current-ratio"; do curl -sS -m 15 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36' "$u" > "dump/$(echo $u | tr -c 'a-z0-9' '_').html"; done
      - if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -B probe-shots && git add -f dump && git commit -qm dump && git push -qf origin probe-shots
    permissions: { contents: write }
