# Render Blueprint — free long-running Node host for PrimePipFX Command Center.
# One service runs the Express server (dist/server.cjs), which serves the built front end from
# dist/ and every /api/* route. On a long-running host the fundamentals/news refreshers run on a
# background schedule instead of per request, which is far cheaper than serverless.
#
# The free plan has only 512 MB RAM, which is not enough to run the Vite build, so the app is built
# elsewhere and the output is published on the `render-deploy` branch; Render only installs the
# production dependencies and starts the server.
# Deploy: Render dashboard → New → Blueprint → pick this repo → Apply.
# Then copy the environment variables from the old Vercel project into this service's
# Environment tab (names listed in docs/HOSTING.md). The free plan sleeps after 15 min idle and
# wakes on the next visit (first load ~30–60 s).
services:
  - type: web
    name: primepipfx-command-center
    runtime: node
    plan: free
    region: singapore
    branch: render-deploy
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node dist/server.cjs
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
