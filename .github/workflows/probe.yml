name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          B=https://prime-pip-command-center-level.vercel.app
          for i in 1 2 3 4 5 6 7 8; do
            js=$(curl -s $B/ | grep -o 'assets/index-[^"]*\.js' | head -1)
            code=$(curl -s -o /tmp/s.json -w '%{http_code}' "$B/api/sbt/scan?symbol=EURUSD")
            echo "TRY $i bundle=$js scan=$code $(head -c 200 /tmp/s.json)"
            if [ "$code" = "503" ] || [ "$code" = "200" ]; then break; fi
            sleep 30
          done
          curl -s $B/ | grep -o 'assets/[^"]*\.js' | sort -u | while read f; do curl -s $B/$f | grep -c 'premium-watchlist' | sed "s|^|WATCHLIST in $f: |"; done | grep -v ': 0' | head -3
          curl -s -o /dev/null -w 'UNKNOWN %{http_code}\n' "$B/api/sbt/scan?symbol=NOPE"
