name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: bash {0}
        run: |
          B=https://prime-pip-command-center-level.vercel.app
          n=0; for f in $(curl -s $B/ | grep -o 'assets/[^"]*\.js' | sort -u); do c=$(curl -s $B/$f | grep -c 'advanced-library'); n=$((n+c)); done; echo "LIVE new bundle: $n"
          curl -s -o /dev/null -w 'APP %{http_code}\n' $B/
          for i in 1 2 3; do curl -s -o /dev/null -w "LOGIN(bad) %{http_code} %{time_total}s\n" -H 'content-type: application/json' -d '{"username":"nobody-ci","password":"x-wrong-1"}' $B/api/auth/login; done
          curl -s -w ' SBT %{http_code}\n' "$B/api/sbt/scan?symbol=EURUSD" | cut -c1-160
