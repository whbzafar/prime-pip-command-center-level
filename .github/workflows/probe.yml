name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          B=https://prime-pip-command-center-level.vercel.app
          for q in "before=1078905600000" "before=1078905600123" "before=1078909200000"; do
            echo "== m15 $q"; curl -s -D h.txt "$B/api/history/candles?src=duka&id=eurusd&tf=m15&count=500&alt=EURUSD%3DX&arch=EURUSD&$q" -o b.json; grep -i "cache-control\|x-vercel-cache\|^age" h.txt; python3 -c "import json;j=json.load(open('b.json'));c=j.get('candles') or [];print(j.get('src'),j.get('error'),len(c),c and c[0]['timestamp'],c and c[-1]['timestamp'])"
          done
          curl -s "$B/api/history/archive?ticker=EURUSD" | head -c 300; echo
