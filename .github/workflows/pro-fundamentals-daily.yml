name: Pro Fundamentals Daily FRED Incremental Pipeline

on:
  schedule:
    # 22:30 UTC Monday-Friday (6:30 PM US Eastern, safely after 5:00 PM US market close & Fed releases)
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pro-fundamentals-collectors
  cancel-in-progress: false

jobs:
  run-daily-fred:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Incremental FRED Collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npx tsx backend/jobs/runCollectors.ts --source fred

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 [ProFundamentals] Daily FRED Collector Failed: ${new Date().toISOString()}`;
            const body = `The daily incremental FRED collector encountered an error.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nReview ingestion_runs in Supabase for stack trace.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['pipeline-failure', 'fred-collector']
            });
