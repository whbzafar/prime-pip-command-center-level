name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          mkdir -p dump
          for q in "filter=EURUSD" "filter=fxssi" "filter=EURUSD&token=&user_id=0&rand=0.5"; do echo "== $q"; curl -sS -m 15 -A "$UA" -e https://fxssi.com/tools/current-ratio "https://c.fxssi.com/api/current-ratios?$q" | tee "dump/fxssi_$q.json" | head -c 1500; echo; done
          curl -sSL -m 15 -A "$UA" https://www.ig.com/en/ig-client-sentiment > dump/ig.html; wc -c dump/ig.html
          sleep 200
          for u in "https://c.fxssi.com/api/current-ratios?filter=EURUSD" "https://www.ig.com/en/ig-client-sentiment"; do echo "== VERCEL $u"; curl -s -m 40 "https://prime-pip-command-center-level.vercel.app/api/history/_sprobe?u=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$u")" | head -c 1200; echo; done
      - if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -B probe-shots && git add -f dump && git commit -qm dump && git push -qf origin probe-shots
