name: Pro Fundamentals Scoring Dispatch

on:
  workflow_dispatch:
    inputs:
      asset:
        description: 'Target asset symbol (e.g. USD) or all'
        required: true
        default: 'all'
        type: string
      as_of:
        description: 'Point-in-time calculation timestamp (ISO 8601, e.g. 2026-10-15T22:00:00Z - leave blank for current hour)'
        required: false
        type: string
      backfill_days:
        description: 'Number of historical daily checkpoints to backfill (e.g. 90)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (simulate calculations without database writes)'
        required: true
        default: false
        type: boolean

concurrency:
  group: pro-fundamentals-scoring
  cancel-in-progress: false

jobs:
  run-scoring-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Execute Scoring Engine Job
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--asset ${{ github.event.inputs.asset }}"
          if [ -n "${{ github.event.inputs.as_of }}" ]; then
            ARGS="$ARGS --as-of ${{ github.event.inputs.as_of }}"
          fi
          if [ -n "${{ github.event.inputs.backfill_days }}" ]; then
            ARGS="$ARGS --backfill-days ${{ github.event.inputs.backfill_days }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Executing: npx tsx backend/jobs/runScoring.ts $ARGS"
          npx tsx backend/jobs/runScoring.ts $ARGS

      - name: Notify on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 [ProFundamentals] Scoring Dispatch Failed: ${new Date().toISOString()}`;
            const body = `Quantitative scoring dispatch failed.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['pipeline-failure', 'scoring-dispatch']
            });
