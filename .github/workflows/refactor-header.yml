name: Refactor Header Collapse

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor Header.tsx safely
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/Header.tsx')
          s = p.read_text()
          start = s.index("  // Upper Header Collapsible State (Auto-collapse on scroll & manual toggle)")
          end = s.index("  const checkScrollState = () =>", start)
          replacement = '''  // Header collapse is manual only. Page scrolling must never change this state.\n  const [isHeaderCollapsed, setIsHeaderCollapsed] = useState<boolean>(false);\n\n  const toggleHeader = () => {\n    setIsHeaderCollapsed((prev) => !prev);\n  };\n\n'''
          s = s[:start] + replacement + s[end:]
          tab_block = '''  // When switching tabs, auto-collapse upper header on mobile to maximize workspace\n  useEffect(() => {\n    if (window.innerWidth < 768) {\n      setIsUpperHeaderExpanded(false);\n    }\n  }, [activeTab]);\n\n'''
          s = s.replace(tab_block, '')
          s = s.replace('isUpperHeaderExpanded', '!isHeaderCollapsed')
          s = s.replace('setIsUpperHeaderExpanded', 'setIsHeaderCollapsed')
          s = s.replace('onClick={() => setIsHeaderCollapsed((prev) => !prev)}', 'onClick={toggleHeader}')
          s = s.replace('className="border-b border-slate-800/80 bg-[#0B0F19]/95 backdrop-blur sticky top-0 z-40"', 'className="border-b border-slate-800/80 bg-[#0B0F19]/95 backdrop-blur"')
          s = s.replace('className="px-3 sm:px-4 py-1.5 bg-[#080C14] border-b border-slate-800/80 flex items-center justify-between gap-2 text-xs font-mono-code text-slate-300"', 'className="fixed top-0 left-0 right-0 h-14 px-3 sm:px-4 bg-[#080C14] border-b border-slate-800/80 flex items-center justify-between gap-2 text-xs font-mono-code text-slate-300 z-[1000]"')
          p.write_text(s)
      - name: Add stable CSS
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/index.css')
          s = p.read_text()
          marker = '/* Stable manual header collapse */'
          if marker not in s:
            s += '''\n\n/* Stable manual header collapse */\n.header-collapsible {\n  overflow: hidden;\n  transition: max-height 0.3s ease-in-out, opacity 0.2s ease-in-out;\n  box-sizing: border-box;\n}\n'''
            p.write_text(s)
      - name: Verify
        shell: bash
        run: |
          ! grep -nE "window\.addEventListener\(['\"]scroll|window\.scrollY|requestAnimationFrame|onScroll" src/components/Header.tsx
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Header.tsx src/index.css
          git commit -m "fix: stable manual header collapse" || exit 0
          git push
