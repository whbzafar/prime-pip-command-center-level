name: probe
on: { push: { branches: [ci/macro-live-probe] } }
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: feature/fundamental-analysis-engine, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd app && npm ci --no-audit --no-fund >/dev/null 2>&1 && npm run build >/dev/null 2>&1 && ls dist | head -3
      - run: mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
      - run: |
          (node fakekv.mjs > /tmp/kv.log 2>&1 &)
          (cd app && PORT=3000 PRIMEPIPFX_SESSION_SECRET=ci-only-secret-0123456789 PRIMEPIPFX_BOOTSTRAP_ADMIN_PASSWORD=ci-admin-pass-123456 PPFX_SHARED_KV_URL=http://localhost:8798/b node dist/server.cjs > /tmp/server.log 2>&1 &)
          sleep 15
          mkdir -p shots; cp final.mjs /tmp/pw/ && (cd /tmp/pw && mkdir -p shots && PRIMEPIPFX_BOOTSTRAP_ADMIN_PASSWORD=ci-admin-pass-123456 timeout 1500 node final.mjs); cp -r /tmp/pw/shots/. shots/ || true
          tail -5 /tmp/server.log
      - if: always()
        run: |
          git config user.name ci; git config user.email ci@example.com
          git checkout -B probe-shots && git add -f shots && git commit -qm shots && git push -qf origin probe-shots
