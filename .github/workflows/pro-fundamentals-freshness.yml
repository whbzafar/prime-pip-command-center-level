name: Pro Fundamentals Hourly Freshness Audit

on:
  schedule:
    # Runs hourly to monitor feed status and flag stale series
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  run-freshness-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Audit Feed Freshness & Log Quality Flags
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx backend/jobs/runQualityChecks.ts

      - name: Notify on Quality Degradation
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `⚠️ [ProFundamentals Alert] Feed Freshness Audit Failed: ${new Date().toISOString()}`;
            const body = `Hourly data freshness audit failed.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['data-quality', 'pro-fundamentals']
            });
